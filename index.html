<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая вкладка</title>
    <style>
        :root{
            --bg:#FFFFFF;--text:#202124;--placeholder:#9AA0A6;
            --surface:#F1F3F4;--border:#DADCE0;
            --hover:rgba(0,0,0,.06);--hover-text:#202124;
            --dropdown-bg:#FFFFFF;--dropdown-shadow:0 2px 6px 2px rgba(0,0,0,.15),0 0 0 1px rgba(0,0,0,.08);
            --scrollbar-thumb:rgba(0,0,0,.2);--scrollbar-track:transparent;
            --focus-ring:#1A73E8;--status-bg:rgba(241,243,244,.92);
            --favicon-bg:#DADCE0;--favicon-text:#5F6368
        }
        @media(prefers-color-scheme:dark){:root{
            --bg:#202124;--text:#E8EAED;--placeholder:#9AA0A6;
            --surface:#35363A;--border:#5F6368;
            --hover:rgba(255,255,255,.08);--hover-text:#E8EAED;
            --dropdown-bg:#35363A;--dropdown-shadow:0 2px 6px 2px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.2);
            --scrollbar-thumb:rgba(255,255,255,.25);--scrollbar-track:transparent;
            --focus-ring:#8AB4F8;--status-bg:rgba(53,54,58,.92);
            --favicon-bg:#5F6368;--favicon-text:#E8EAED
        }}
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden;background:var(--bg)}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
        .notebook{flex:1;display:flex;flex-direction:column;width:100%}
        .notes-editor{flex:1;background:transparent;border:none;outline:none;font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.6;resize:none;color:inherit;padding:24px 32px;overflow-y:auto;caret-color:currentColor}
        .notes-editor::-webkit-scrollbar{width:8px}
        .notes-editor::-webkit-scrollbar-track{background:var(--scrollbar-track)}
        .notes-editor::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:8px}
        .notes-editor::-webkit-scrollbar-thumb:hover{background:var(--text);opacity:.4}
        .notes-editor::placeholder{color:var(--placeholder)}
        .notes-editor:focus-visible{outline:none}
        .status{position:fixed;bottom:20px;right:24px;font-size:.75rem;font-weight:500;color:var(--text);background:var(--status-bg);backdrop-filter:blur(20px);padding:6px 14px;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);pointer-events:none;opacity:0;will-change:opacity,transform;transition:opacity .15s ease,transform .1s ease;transform:translateY(0);z-index:1000}
        .status.show{opacity:1;transform:translateY(-2px)}
        @media(prefers-reduced-motion:reduce){.status,.status.show{transition:none;transform:none}}
        @media(forced-colors:active){.notes-editor{border:1px solid CanvasText}.notes-editor:focus-visible{outline:2px solid Highlight;outline-offset:2px}.status{border:1px solid CanvasText;background:Canvas}}
        .bookmarks-bar{display:flex;align-items:center;gap:1px;padding:2px 8px;
            /* background:var(--surface);border-bottom:1px solid var(--border); */
            min-height:34px;overflow-x:auto;overflow-y:hidden;flex-shrink:0;scroll-behavior:smooth;position:relative;z-index:100}
        .bookmarks-bar::-webkit-scrollbar{height:3px}
        .bookmarks-bar::-webkit-scrollbar-track{background:var(--scrollbar-track)}
        .bookmarks-bar::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
        .bookmarks-bar:empty{display:none}
        .bm-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;text-decoration:none;color:var(--text);font-size:12.5px;font-weight:400;white-space:nowrap;transition:background .1s ease;cursor:pointer;flex-shrink:0;letter-spacing:.01em}
        .bm-item:hover{background:var(--hover);color:var(--hover-text)}
        .bm-item img,.bm-item .bm-favicon{width:16px;height:16px;border-radius:2px;flex-shrink:0}
        .bm-favicon{display:inline-flex;align-items:center;justify-content:center;background:transparent;font-size:10px;font-weight:600;color:var(--favicon-text);text-transform:uppercase}
        .bm-sep{width:1px;height:16px;background:var(--border);flex-shrink:0;margin:0 4px}
        .bm-folder{position:relative;display:inline-flex;align-items:center}
        .bm-folder-title{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:4px;font-size:12.5px;font-weight:400;white-space:nowrap;color:var(--text);cursor:pointer;flex-shrink:0;transition:background .1s ease;letter-spacing:.01em}
        .bm-folder-title:hover{background:var(--hover);color:var(--hover-text)}
        .bm-folder-title::after{content:'';border:3px solid transparent;border-top:4px solid currentColor;margin-top:1px;opacity:.4}
        .bm-dropdown{display:none;position:fixed;min-width:200px;background:var(--dropdown-bg);border-radius:8px;box-shadow:var(--dropdown-shadow);padding:4px 0;z-index:2147483647;max-height:60vh;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--scrollbar-thumb) var(--scrollbar-track)}
        .bm-dropdown::-webkit-scrollbar{width:6px;height:6px}
        .bm-dropdown::-webkit-scrollbar-track{background:var(--scrollbar-track)}
        .bm-dropdown::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:6px}
        .bm-dropdown::-webkit-scrollbar-thumb:hover{opacity:.4}
        .bm-dropdown::after{content:'';display:none;height:20px;background:linear-gradient(transparent,var(--dropdown-bg));pointer-events:none;border-radius:0 0 8px 8px}
        .bm-dropdown.has-overflow::after{display:block}
        .bm-dropdown .bm-item{width:100%;padding:6px 12px;border-radius:4px;font-size:13px}
        .bm-dropdown .bm-folder{display:block;width:100%}
        .bm-dropdown .bm-folder-title{width:100%;padding:6px 12px;border-radius:4px;font-size:13px}
        .bm-dropdown .bm-dropdown{top:0;left:calc(100% + 2px)}
        .bm-tree{padding-left:16px;border-left:1px solid var(--border);margin-left:8px;margin-top:2px}
        .bm-tree .bm-item,.bm-tree .bm-folder-title{font-size:12px;padding:4px 10px}
        .bm-tree .bm-tree{border-left-color:var(--border);margin-left:6px}
        @media(max-width:768px){.notes-editor{font-size:1rem;padding:20px}}
        @media(max-width:480px){.notes-editor{padding:16px}}
    </style>
</head>
<body>
    <div class="bookmarks-bar" id="bookmarks-bar"></div>
    <div class="notebook">
        <textarea class="notes-editor" id="editor" placeholder="Начните писать...&#10;Всё сохраняется автоматически." spellcheck="true" autofocus></textarea>
    </div>
    <div class="status" id="status"></div>
    <script src="./notes.js"></script>
    <script src="./bookmarks.js"></script>
</body>
</html>
